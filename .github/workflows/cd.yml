name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render and Verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets and Variables
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          MISSING=0
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing required repository secret: RENDER_DEPLOY_HOOK. Please configure your Render deploy hook URL in Settings > Secrets and variables > Actions > Secrets."
            MISSING=1
          fi
          if [ -z "$LIVE_URL" ]; then
            echo "::error::Missing required repository variable: LIVE_URL. Please configure the production service URL in Settings > Secrets and variables > Actions > Variables."
            MISSING=1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set. Pre-deployment migrations will be skipped."
          fi
          if [ $MISSING -ne 0 ]; then
            echo "Deployment aborted due to missing configuration."
            exit 1
          fi
          echo "Required deployment secrets and variables are present."

      - name: Install uv and Python for Migrations
        if: ${{ secrets.DATABASE_URL != '' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        if: ${{ secrets.DATABASE_URL != '' }}
        run: uv python install 3.12

      - name: Run Database Migrations (Neon)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
        run: |
          echo "Executing pre-deployment database migrations against Neon PostgreSQL..."
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          echo "Migrations completed successfully."

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deployment via deploy hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render deploy hook returned unexpected HTTP status: $HTTP_CODE"
            exit 1
          fi
          echo "Render deployment triggered successfully (HTTP $HTTP_CODE)."

      - name: Run Automated Smoke Tests
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Executing smoke tests against $LIVE_URL (Expected SHA: $EXPECTED_SHA)..."
          python scripts/smoke.py --url "$LIVE_URL" --expected-sha "$EXPECTED_SHA" --wait --max-retries 36 --delay 10
