name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Target commit SHA to deploy (defaults to HEAD)"
        required: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render and Verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets and Variables
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          MISSING=0
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing required repository secret: RENDER_DEPLOY_HOOK. Please configure your Render deploy hook URL in Settings > Secrets and variables > Actions > Secrets."
            MISSING=1
          fi
          if [ -z "$LIVE_URL" ]; then
            echo "::error::Missing required repository variable: LIVE_URL. Please configure the production service URL in Settings > Secrets and variables > Actions > Variables."
            MISSING=1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing required repository secret: DATABASE_URL. Please configure the Neon PostgreSQL connection string in Settings > Secrets and variables > Actions > Secrets."
            MISSING=1
          fi
          if [ $MISSING -ne 0 ]; then
            echo "Deployment aborted due to missing configuration."
            exit 1
          fi
          echo "All required deployment secrets (RENDER_DEPLOY_HOOK, DATABASE_URL) and variables (LIVE_URL) are present."

      - name: Resolve Deployment Commit SHA
        id: resolve-sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.target_sha }}" ]; then
            SHA="${{ inputs.target_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "deploy_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Selected deployment SHA: $SHA"

      - name: Install uv and Python for Migrations
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Database Migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: production
        run: |
          echo "Executing pre-deployment database migrations against Neon PostgreSQL..."
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          echo "Migrations completed successfully."

      - name: Trigger Render Deployment with Tested GHCR Image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:${DEPLOY_SHA}"
          echo "Deploying exact image: $IMAGE_TAG"

          # URL-encode IMAGE_TAG using python
          ENCODED_TAG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$IMAGE_TAG")

          if [[ "$RENDER_DEPLOY_HOOK" == *"?"* ]]; then
            TARGET_URL="${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_TAG}"
          else
            TARGET_URL="${RENDER_DEPLOY_HOOK}?imgURL=${ENCODED_TAG}"
          fi

          echo "Calling deploy hook with exact imgURL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$TARGET_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render exact-image deployment failed with HTTP status: $HTTP_CODE"
            exit 1
          fi
          echo "Render deployment triggered successfully (HTTP $HTTP_CODE)."

      - name: Run Automated Smoke Tests
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          EXPECTED_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          echo "Executing smoke tests against $LIVE_URL (Expected SHA: $EXPECTED_SHA)..."
          python scripts/smoke.py --url "$LIVE_URL" --expected-sha "$EXPECTED_SHA" --wait --max-retries 36 --delay 10
