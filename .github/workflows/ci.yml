name: CI

on:
  push:
    branches: ["main", "feat/*", "integration/*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run unit test suite and generate coverage
        run: uv run pytest tests/unit --cov=flutterfix --cov-report=term-missing --cov-report=html:htmlcov

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:${{ job.services.postgres.ports[5432] }}/app_test
        run: |
          uv run pytest tests/integration -v --tb=long 2>&1 | tee pytest_failure.log || {
            echo "## Integration Test Failure" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat pytest_failure.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
