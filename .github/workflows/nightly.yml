name: Nightly Health Check

on:
  schedule:
    # Run every night at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  health-check:
    name: Nightly Service Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Live Smoke Test
        env:
          LIVE_URL: ${{ vars.LIVE_URL || 'https://prince28-dev14-flutterfix.onrender.com' }}
        run: |
          echo "Running scheduled nightly health check against $LIVE_URL..."
          python scripts/smoke.py --url "$LIVE_URL"
