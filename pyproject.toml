[project]
name = "flutterfix"
version = "0.1.0"
description = "A Flutter and Dart mentor that answers from official docs and breaking-changes pages for the user's Flutter version."
readme = "README.md"
authors = [
    { name = "CHOKESHWARAN", email = "chokeshwaran.m.it.28@psvpec.in" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.26,<2",
    "pypdf>=7.1.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Harmless notice from newer Starlette versions; hide it so real warnings stand out.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["flutterfix"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.poe.tasks]
dev = "python -m uvicorn flutterfix.api.main:create_app --factory --reload --no-access-log"
worker = "arq flutterfix.workers.main.WorkerSettings"
lint = ["lint-check", "format-check"]
lint-check = "python -m ruff check ."
format-check = "python -m ruff format --check ."
migrate = "python -m alembic upgrade head"
seed = "python scripts/load_db.py"
smoke = "python scripts/smoke.py"

[tool.poe.tasks.test]
cmd = "python -m pytest tests/unit"
env = { DISABLE_SQLALCHEMY_CEXT = "1", PYTEST_DEBUG_TEMPROOT = ".pytest_tmp" }

[tool.poe.tasks.cov]
cmd = "python -m pytest tests/unit --cov=flutterfix --cov-report=term-missing --cov-report=html:htmlcov"
env = { DISABLE_SQLALCHEMY_CEXT = "1", PYTEST_DEBUG_TEMPROOT = ".pytest_tmp" }

[tool.poe.tasks.test-integration]
cmd = "python -m pytest tests/integration"
env = { TEST_DATABASE_URL = "postgresql://app:app@localhost:5433/app_test", DISABLE_SQLALCHEMY_CEXT = "1" }
